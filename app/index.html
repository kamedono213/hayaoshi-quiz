<title>はやおしクイズ</title>
<meta name="description" content="問題文が1文字ずつ出てくる早押しクイズの練習アプリ。効果・現象・法則の名前を答えるオリジナル問題236問">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト: クイズ番組のセット。紺の問題ボードに白い文字、押すボタンは大きな赤 */
:root {
  --bg: #f4f1ea; --card: #ffffff; --ink: #1f2236; --sub: #626579; --line: #e3ddd0;
  --board: #16204a; --board-ink: #f3f5ff; --accent: #e23b3b; --accent2: #1f5fae; --ok: #2e8a5c; --ng: #c63d4f;
  --display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --r: 14px; color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
#app { max-width: 640px; margin: 0 auto; padding: 14px 16px 60px; display: flex; flex-direction: column; gap: 14px; }
h1, h2 { font-family: var(--display); font-weight: 800; margin: 0; }
h2 { font-size: 16px; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent2); outline-offset: 2px; }
.muted { color: var(--sub); } .small { font-size: 13px; } .center { text-align: center; } .num { font-variant-numeric: tabular-nums; }
.mast { display: grid; gap: 4px; padding-top: 6px; }
.mast .eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--sub); }
.mast h1 { font-size: clamp(36px, 11vw, 54px); line-height: 1.1; } .mast h1 span { color: var(--accent); }
.panel { display: grid; gap: 8px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: #faf8f3; border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.chip small { margin-left: 6px; color: var(--sub); font-size: 11px; }
.chip[aria-pressed="true"] { border-color: var(--accent2); background: #e8f0fb; font-weight: 700; }
.primary { border: 0; border-radius: var(--r); background: var(--accent2); color: #fff; font-weight: 700; padding: 13px; }
.primary.big { font-size: 18px; padding: 15px; }
.ghost { border: 1px solid var(--line); background: var(--card); border-radius: var(--r); padding: 12px; font-weight: 700; }
.link { background: none; border: 0; color: var(--accent2); font-weight: 700; padding: 8px 0; }
.bar { display: flex; justify-content: space-between; align-items: center; }
.track { height: 6px; border-radius: 3px; background: #e2dccd; overflow: hidden; } .track i { display: block; height: 100%; background: var(--accent2); }
.board { background: var(--board); color: var(--board-ink); border-radius: 18px; padding: 18px 18px 22px; min-height: 190px; display: grid; gap: 10px; align-content: start; box-shadow: inset 0 0 0 4px #2b3a7a; }
.board .tag { justify-self: start; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: #2b3a7a; color: #c9d3ff; }
.qtext { font-family: var(--display); font-size: 22px; font-weight: 800; line-height: 1.6; letter-spacing: .02em; }
.cur { font-style: normal; color: #ffd24a; animation: blink .8s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.push { width: 100%; aspect-ratio: 2.4 / 1; border: 0; border-radius: 26px; background: radial-gradient(circle at 50% 35%, #ff6b6b, var(--accent) 60%, #a51f1f); color: #fff; font-family: var(--display); font-size: 44px; font-weight: 800; box-shadow: 0 8px 0 #8a1818; }
.push:active { transform: translateY(6px); box-shadow: 0 2px 0 #8a1818; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); font-size: 17px; }
.choice.ok { border-color: var(--ok); background: #e7f5ee; } .choice.ng { border-color: var(--ng); background: #fbe9ec; }
.ans { display: grid; gap: 6px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.ans .a { font-family: var(--display); font-size: 26px; font-weight: 800; color: var(--accent); }
.judge { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.okb, .ngb { border: 0; border-radius: var(--r); padding: 16px; font-size: 20px; font-weight: 800; color: #fff; }
.okb { background: var(--ok); } .ngb { background: var(--ng); }
.score { font-family: var(--display); font-size: 56px; font-weight: 800; color: #fff; }
.board.center { justify-items: center; align-content: center; }
.shop { display: grid; gap: 4px; padding: 14px 16px; border-radius: var(--r); background: var(--card); border: 1px dashed var(--accent2); color: inherit; text-decoration: none; }
.shop b { color: var(--accent2); } .shop span { font-size: 13px; color: var(--sub); }
.foot { margin-top: 4px; }
#act { display: grid; gap: 14px; }
</style>
<div id="app"></div>
<script src="furi.js"></script>
<script src="app.js"></script>
